<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Prettifier Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Section */
        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Main Content */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 1px;
            background-color: var(--border-color);
        }

        .panel {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 20px;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none; /* 크기 조절 비활성화 */
            outline: none;
        }

        .output-display {
            flex: 1;
            padding: 20px;
            overflow: auto;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Copy Button */
        .copy-btn {
            padding: 4px 12px;
            background: var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #475569;
        }

        /* JSON Syntax Coloring */
        .json-key { color: #7dd3fc; }
        .json-string { color: #fbbf24; }
        .json-number { color: #4ade80; }
        .json-boolean { color: #f472b6; }
        .json-null { color: #f472b6; }

        /* Error Toast */
        #error-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            z-index: 100;
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">
            <h1>JSON Prettifier Pro</h1>
            <p>이사를 위한 깔끔하고 스마트한 JSON 도구</p>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="convertJson()">
                <span>🎨</span> 변환하기
            </button>
        </div>
    </header>

    <main class="main-container">
        <section class="panel">
            <div class="panel-header">Input JSON</div>
            <textarea id="input-json" placeholder='여기에 JSON을 붙여넣으세요...'></textarea>
        </section>

        <section class="panel">
            <div class="panel-header">
                Formatted Output
                <button class="copy-btn" onclick="copyToClipboard()">복사하기</button>
            </div>
            <div id="output-display" class="output-display">변환된 결과가 여기에 표시됩니다...</div>
        </section>
    </main>

    <div id="error-message"></div>

    <script>
        let currentFormattedJson = "";

        function convertJson() {
            const input = document.getElementById("input-json").value.trim();
            const outputDiv = document.getElementById("output-display");
            
            hideError();

            if (!input) {
                showError("JSON 내용을 입력해주세요.");
                return;
            }

            try {
                let parsed;
                // 문자열 내에 이중으로 감싸진 경우 처리 포함
                try {
                    parsed = JSON.parse(input);
                    if (typeof parsed === "string") parsed = JSON.parse(parsed);
                } catch (e) {
                    parsed = JSON.parse(input);
                }

                currentFormattedJson = JSON.stringify(parsed, null, 2);
                outputDiv.innerHTML = syntaxHighlight(currentFormattedJson);
            } catch (error) {
                showError("올바르지 않은 JSON 형식입니다: " + error.message);
            }
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = "json-number";
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = "json-key";
                    } else {
                        cls = "json-string";
                    }
                } else if (/true|false/.test(match)) {
                    cls = "json-boolean";
                } else if (/null/.test(match)) {
                    cls = "json-null";
                }
                return `<span class="${cls}">${match}</span>`;
            });
        }

        function copyToClipboard() {
            if (!currentFormattedJson) {
                showError("복사할 내용이 없습니다.");
                return;
            }
            navigator.clipboard.writeText(currentFormattedJson).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = "복사 완료!";
                btn.style.background = "#059669";
                setTimeout(() => {
                    btn.textContent = "복사하기";
                    btn.style.background = "";
                }, 2000);
            });
        }

        function showError(msg) {
            const err = document.getElementById("error-message");
            err.textContent = msg;
            err.style.display = "block";
            setTimeout(hideError, 3000);
        }

        function hideError() {
            document.getElementById("error-message").style.display = "none";
        }

        // 단축키 지원
        document.addEventListener("keydown", function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                convertJson();
            }
        });
    </script>
</body>
</html>
