<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 서버 실행기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .launch-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .launch-btn:hover {
            background-color: #45a049;
        }
        .info {
            margin-bottom: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>게임 서버 실행기</h1>
        <div class="info">
            <p>사용자: r1</p>
            <p>게임 서버로 연결됩니다</p>

        <button class="launch-btn" onclick="launchGame()">게임 시작하기</button>
    </div>

    <script>
        // postToGameServer 함수 정의
        function postToGameServer(url, { uid, nickname, access_token, refresh_token }) {
            // 새 창에서 게임 서버 열기
            const gameWindow = window.open(url, "_blank");

            // 게임 창이 로드된 후 데이터 전송
            setTimeout(() => {
                if (gameWindow && !gameWindow.closed) {
                    // postMessage로 데이터 전송
                    gameWindow.postMessage(
                        {
                            type: "PLATFORM_LOGIN_DATA",
                            uid,
                            nickname,
                            access_token,
                            refresh_token,
                        },
                        url
                    );
                }
            }, 2000); // 2초 대기
        }
