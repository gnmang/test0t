<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클립보드 뷰어</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .description {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #result {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            color: #333;
            line-height: 1.6;
        }
        
        #result:empty::before {
            content: '여기에 클립보드 내용이 표시됩니다...';
            color: #adb5bd;
            font-style: italic;
        }
        
        .info {
            margin-top: 15px;
            padding: 12px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }
        
        .error {
            margin-top: 15px;
            padding: 12px;
            background: #ffebee;
            border-left: 4px solid #f44336;
            border-radius: 4px;
            font-size: 13px;
            color: #c62828;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 클립보드 뷰어</h1>
        <p class="description">Ctrl+C로 복사한 내용을 텍스트로 확인할 수 있습니다</p>
        
        <button onclick="readClipboard()">클립보드 내용 읽기</button>
        
        <div id="result"></div>
        
        <div class="info">
            💡 처음 버튼을 클릭하면 브라우저에서 클립보드 접근 권한을 요청할 수 있습니다. '허용'을 선택해주세요.
        </div>
        
        <div class="error" id="error"></div>
    </div>
    
    <script>
        async function readClipboard() {
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            
            errorDiv.style.display = 'none';
            resultDiv.textContent = '읽는 중...';
            
            try {
                const text = await navigator.clipboard.readText();
                
                if (text) {
                    resultDiv.textContent = text;
                } else {
                    resultDiv.textContent = '클립보드가 비어있습니다.';
                }
            } catch (err) {
                resultDiv.textContent = '';
                errorDiv.textContent = '❌ 클립보드를 읽을 수 없습니다. 브라우저에서 클립보드 접근 권한을 허용해주세요.';
                errorDiv.style.display = 'block';
                console.error('클립보드 읽기 실패:', err);
            }
        }
    </script>
</body>
</html>
