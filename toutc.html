<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC 시간 표시기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 300;
        }

        .time-section {
            margin: 30px 0;
        }

        .get-time-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .get-time-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
        }

        .get-time-btn:active {
            transform: translateY(0);
        }

        .time-display {
            margin: 30px 0;
            display: none;
        }

        .time-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-value {
            background: #f8f9ff;
            border: 2px solid #e1e5f7;
            padding: 15px 20px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #333;
            min-width: 250px;
            word-break: break-all;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .copy-btn:hover {
            background: #218838;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-success {
            background: #20c997 !important;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: #e8f4fd;
            border-radius: 12px;
            color: #0c5460;
            font-size: 14px;
            border-left: 4px solid #17a2b8;
        }

        @media (max-width: 480px) {
            .time-container {
                flex-direction: column;
            }
            
            .time-value {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 UTC 시간 표시기</h1>
        
        <div class="time-section">
            <button class="get-time-btn" onclick="getCurrentUTCTime()">
                현재 UTC 시간 가져오기
            </button>
        </div>

        <div id="timeDisplay" class="time-display">
            <div class="time-container">
                <div id="timeValue" class="time-value"></div>
                <button class="copy-btn" onclick="copyToClipboard()">
                    📋 복사
                </button>
            </div>
        </div>

        <div class="info">
            💡 버튼을 클릭하면 현재 시간이 UTC 형식(ISO 8601)으로 표시됩니다.<br>
            복사 버튼을 눌러 클립보드에 복사할 수 있습니다.
        </div>
    </div>

    <script>
        let currentTimeString = '';

        function getCurrentUTCTime() {
            // 현재 시간을 UTC로 가져와서 ISO 형식으로 변환
            const now = new Date();
            currentTimeString = now.toISOString();
            
            // 시간 표시
            document.getElementById('timeValue').textContent = currentTimeString;
            document.getElementById('timeDisplay').style.display = 'block';
            
            // 부드러운 나타나기 효과
            setTimeout(() => {
                document.getElementById('timeDisplay').style.opacity = '0';
                document.getElementById('timeDisplay').style.transform = 'translateY(20px)';
                document.getElementById('timeDisplay').style.transition = 'all 0.3s ease';
                document.getElementById('timeDisplay').style.display = 'block';
                
                setTimeout(() => {
                    document.getElementById('timeDisplay').style.opacity = '1';
                    document.getElementById('timeDisplay').style.transform = 'translateY(0)';
                }, 10);
            }, 10);
        }

        function copyToClipboard() {
            if (!currentTimeString) return;
            
            // 클립보드에 복사
            navigator.clipboard.writeText(currentTimeString).then(function() {
                // 복사 성공 피드백
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.textContent;
                
                copyBtn.textContent = '✅ 복사됨!';
                copyBtn.classList.add('copy-success');
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('copy-success');
                }, 2000);
            }).catch(function(err) {
                console.error('복사 실패:', err);
                // 복사 실패 시 텍스트 선택으로 대체
                const timeValue = document.getElementById('timeValue');
                const range = document.createRange();
                range.selectNode(timeValue);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                
                const copyBtn = document.querySelector('.copy-btn');
                copyBtn.textContent = '📝 선택됨';
                setTimeout(() => {
                    copyBtn.textContent = '📋 복사';
                }, 2000);
            });
        }

        // 페이지 로드 시 자동으로 시간 표시 (선택사항)
        // getCurrentUTCTime();
    </script>
</body>
</html>
