<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background-color: #2d2d2d;
            padding: 15px 20px;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            color: #d4d4d4;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #569cd6;
            color: #1e1e1e;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn:hover {
            background-color: #4a8ac2;
        }

        .container {
            display: flex;
            height: calc(100vh - 52px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3a3a3a;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background-color: #252526;
            padding: 10px 20px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 14px;
            color: #888;
        }

        .editor-container {
            flex: 1;
            overflow: auto;
        }

        #markdown-editor {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        #html-preview {
            padding: 20px;
            height: 100%;
            overflow: auto;
            background-color: #1e1e1e;
        }

        /* Markdown Preview Styles */
        #html-preview h1 {
            color: #d4d4d4;
            font-size: 32px;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid #3a3a3a;
            padding-bottom: 10px;
        }

        #html-preview h2 {
            color: #d4d4d4;
            font-size: 24px;
            margin: 20px 0 10px 0;
            border-left: 3px solid #569cd6;
            padding-left: 10px;
        }

        #html-preview h3 {
            color: #d4d4d4;
            font-size: 20px;
            margin: 15px 0 8px 0;
        }

        #html-preview p {
            margin: 10px 0;
            line-height: 1.6;
        }

        #html-preview a {
            color: #569cd6;
            text-decoration: none;
        }

        #html-preview a:hover {
            text-decoration: underline;
        }

        #html-preview code {
            background-color: #252526;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #d4d4d4;
        }

        #html-preview pre {
            background-color: #252526;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #3a3a3a;
        }

        #html-preview pre code {
            background-color: transparent;
            padding: 0;
        }

        #html-preview ul, #html-preview ol {
            margin: 10px 0 10px 20px;
        }

        #html-preview li {
            margin: 5px 0;
        }

        #html-preview blockquote {
            border-left: 3px solid #569cd6;
            padding-left: 15px;
            margin: 10px 0;
            color: #888;
        }

        #html-preview table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            border: 2px solid #3a3a3a;
        }

        #html-preview th, #html-preview td {
            border: 2px solid #3a3a3a;
            padding: 8px 12px;
            text-align: left;
        }

        #html-preview th {
            background-color: #252526;
            font-weight: bold;
        }

        #html-preview hr {
            border: none;
            border-top: 1px solid #3a3a3a;
            margin: 20px 0;
        }

        #html-preview strong {
            color: #d4d4d4;
            font-weight: bold;
        }

        #html-preview em {
            font-style: italic;
        }

        /* JSON Syntax Highlighting */
        .json-key {
            color: #9cdcfe;
        }
        
        .json-string {
            color: #ce9178;
        }
        
        .json-number {
            color: #b5cea8;
        }
        
        .json-boolean {
            color: #569cd6;
        }
        
        .json-null {
            color: #569cd6;
        }

        /* Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Markdown to HTML Converter</h1>
        <div class="header-buttons">
            <button class="btn" onclick="copyHTML()">Copy HTML</button>
            <button class="btn" onclick="clearEditor()">Clear</button>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-header">Markdown</div>
            <div class="editor-container">
                <textarea id="markdown-editor" placeholder="마크다운을 입력하세요..."></textarea>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">HTML Preview</div>
            <div class="editor-container">
                <div id="html-preview"></div>
            </div>
        </div>
    </div>

    <script>
        // JSON Syntax Highlighting
        function highlightJSON(code) {
            return code.replace(
                /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function(match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        // Simple Markdown to HTML converter
        function markdownToHTML(markdown) {
            let html = markdown;

            // Tables - must be processed first
            html = parseMarkdownTables(html);

            // Code blocks - process before other replacements
            html = html.replace(/```(?:json)?\n?([\s\S]*?)```/g, function(match, code) {
                const trimmedCode = code.trim();
                const highlighted = highlightJSON(trimmedCode);
                return '<pre><code>' + highlighted + '</code></pre>';
            });

            // Inline code
            html = html.replace(/`(.+?)`/g, '<code>$1</code>');

            // Headers
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.+?)_/g, '<em>$1</em>');

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

            // Images
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

            // Blockquotes
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');

            // Horizontal rule
            html = html.replace(/^---$/gim, '<hr>');

            // Unordered lists
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

            // Ordered lists
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');

            // Line breaks
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');

            // Wrap in paragraphs
            if (!html.startsWith('<h') && !html.startsWith('<ul') && !html.startsWith('<ol') && !html.startsWith('<blockquote') && !html.startsWith('<table')) {
                html = '<p>' + html + '</p>';
            }

            return html;
        }

        // Parse markdown tables
        function parseMarkdownTables(markdown) {
            const lines = markdown.split('\n');
            let result = [];
            let inTable = false;
            let tableLines = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmedLine = line.trim();
                
                // Check if line is a table row (contains | and has content)
                if (trimmedLine.includes('|') && trimmedLine.length > 2) {
                    if (!inTable) {
                        inTable = true;
                    }
                    tableLines.push(trimmedLine);
                } else {
                    // If we were in a table, process it
                    if (inTable && tableLines.length > 0) {
                        result.push(convertTableToHTML(tableLines));
                        tableLines = [];
                        inTable = false;
                    }
                    // Only add non-empty lines or preserve intentional blank lines
                    if (line.trim() !== '' || !inTable) {
                        result.push(line);
                    }
                }
            }

            // Process any remaining table
            if (tableLines.length > 0) {
                result.push(convertTableToHTML(tableLines));
            }

            return result.join('\n');
        }

        function convertTableToHTML(tableLines) {
            if (tableLines.length < 2) return tableLines.join('\n');

            let html = '<table>';
            
            // Process header row
            const headerRow = tableLines[0].split('|').map(cell => cell.trim()).filter(cell => cell !== '');
            html += '<thead><tr>';
            headerRow.forEach(cell => {
                html += `<th>${cell}</th>`;
            });
            html += '</tr></thead>';

            // Skip separator row (index 1)
            // Process body rows
            if (tableLines.length > 2) {
                html += '<tbody>';
                for (let i = 2; i < tableLines.length; i++) {
                    const cells = tableLines[i].split('|').map(cell => cell.trim()).filter(cell => cell !== '');
                    html += '<tr>';
                    cells.forEach(cell => {
                        html += `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                }
                html += '</tbody>';
            }

            html += '</table>';
            return html;
        }

        const editor = document.getElementById('markdown-editor');
        const preview = document.getElementById('html-preview');

        // Initialize with sample content
const sampleMarkdown = `
# 📘 마크다운 샘플 문서

## 1. 제목 (Headings)
# H1 제목
## H2 제목
### H3 제목
#### H4 제목
##### H5 제목
###### H6 제목

---

## 2. 텍스트 스타일
- **굵게** → \`**굵게**\`
- *기울임* → \`*기울임*\`
- ~~취소선~~ → \`~~취소선~~\`
- \`인라인 코드\` → \`\` \`인라인 코드\` \`\`

---

## 3. 목록 (Lists)

### ● 순서 없는 목록
- 항목 A
  - 하위 항목 A1
  - 하위 항목 A2
- 항목 B

### ● 순서 있는 목록
1. 첫 번째
2. 두 번째
   1. 하위 첫 번째
   2. 하위 두 번째

---

## 4. 링크 & 이미지
[네이버](https://www.naver.com)

![샘플 이미지](https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/320px-PNG_transparency_demonstration_1.png)

---

## 5. 인용문 (Blockquote)
> 인용문 예시입니다.
>> 중첩 인용도 가능합니다.

---

## 6. 코드 블록 (Code Block)
\`\`\`python
def hello():
    print("Hello Markdown!")
\`\`\`
`;


        editor.value = sampleMarkdown;

        // Update preview on input
        editor.addEventListener('input', updatePreview);

        function updatePreview() {
            const markdown = editor.value;
            preview.innerHTML = markdownToHTML(markdown);
        }

        function copyHTML() {
            const htmlContent = preview.innerHTML;
            navigator.clipboard.writeText(htmlContent).then(() => {
                alert('HTML이 클립보드에 복사되었습니다!');
            });
        }

        function clearEditor() {
            editor.value = '';
            preview.innerHTML = '';
        }

        // Initial preview
        updatePreview();
    </script>
</body>
</html>
