<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Markdown Viewer</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css" rel="stylesheet">

<style>
:root {
  --bg: #2b2f36;
  --text: #ffffff;
  --accent: #e6e6e6;
  --code: #1f2329;
  --fontSize: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
}

/* ===== Editor ===== */
textarea {
  width: 100%;
  height: 100%;
  padding: 20px;
  background: transparent;
  color: var(--text);
  border: none;
  border-right: 1px solid var(--accent);
  outline: none;
  resize: none;
  font-size: var(--fontSize);
  line-height: 1.9;
}

/* ===== Preview ===== */
.preview {
  padding: 32px;
  font-size: var(--fontSize);
  line-height: 1.8;
}

.preview p {
  margin: 0 0 12px;
}

.preview table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
}

.preview th {
  background: #3a3f47;
  font-weight: 700;
}

.preview th,
.preview td {
  border: 1px solid var(--accent);
  padding: 10px 12px;
  line-height: 1.6;
}

.preview tr:nth-child(even) td {
  background: rgba(255,255,255,0.03);
}

.preview h1 { font-size: 2.2em; font-weight: 800; }
.preview h2 { font-size: 1.6em; font-weight: 800; }
.preview h3 { font-size: 1.3em; font-weight: 700; }

.preview hr {
  border: none;
  border-top: 2px solid var(--accent);
  margin: 24px 0;
}

.preview ul { padding-left: 20px; }
.preview li { margin: 6px 0; }

.preview pre {
  background: var(--code);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
}

.preview table {
  border-collapse: collapse;
  margin: 16px 0;
}
.preview th, .preview td {
  border: 1px solid var(--accent);
  padding: 8px 12px;
}

.preview img {
  max-width: 100%;
  border-radius: 8px;
  margin: 12px 0;
}

.preview a {
  color: #6cb6ff;
  text-decoration: none;
}
.preview a:hover { text-decoration: underline; }
.preview ul {
  padding-left: 20px;
  margin: 12px 0;
}

.preview li {
  margin: 6px 0;
}

.preview .list-sub {
  margin-left: 24px;
  margin-bottom: 8px;
  color: rgba(255,255,255,0.85);
}


/* ===== Controls ===== */
.controls {
  position: fixed;
  bottom: 16px;
  left: 16px;
  background: #000;
  padding: 12px;
  border-radius: 10px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.controls label { font-size: 12px; }
</style>
</head>

<body>

<textarea id="editor"></textarea>
<div class="preview" id="preview"></div>

<div class="controls">
  <label>BG <input type="color" id="bg"></label>
  <label>Text <input type="color" id="text"></label>
  <label>Accent <input type="color" id="accent"></label>
  <label>Size <input type="range" id="size" min="12" max="22"></label>
  <button onclick="saveTheme()">Save</button>
  <button onclick="loadTheme()">Load</button>
  <button onclick="openNew()">New</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>

<script>
const editor = document.getElementById("editor");
const preview = document.getElementById("preview");

editor.value = `# 📘 Markdown Viewer

## 코드 블록 테스트

\`\`\`json
{
  "id": 1,
  "name": "test",
  "value": "<script>"
}
\`\`\`

## 링크 & 이미지
[OpenAI](https://openai.com)

![샘플 이미지](https://picsum.photos/400/200)

## 테이블
| ID | Name |
|----|------|
| 1  | Test |
| 2  | Demo |
`;

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function parseTable(md) {
  return md.replace(
    /((?:\|.*\|\n)+)/g,
    block => {
      const lines = block.trim().split("\n");
      if (!lines[1]?.match(/^\|[\s\-:|]+\|$/)) return block;

      const headers = lines[0].split("|").slice(1,-1).map(v=>v.trim());
      const rows = lines.slice(2).map(r =>
        r.split("|").slice(1,-1).map(v=>v.trim())
      );

      let html = "<table><thead><tr>";
      headers.forEach(h => html += `<th>${h}</th>`);
      html += "</tr></thead><tbody>";

      rows.forEach(row => {
        html += "<tr>";
        row.forEach(col => html += `<td>${col}</td>`);
        html += "</tr>";
      });

      html += "</tbody></table>";
      return html;
    }
  );
}
function parseList(md) {
  const lines = md.split("\n");
  let html = "";
  let inList = false;

  lines.forEach(line => {
    if (/^- /.test(line)) {
      if (!inList) {
        html += "<ul>";
        inList = true;
      }
      html += `<li>${line.replace(/^- /, "")}</li>`;
      return;
    }

    if (inList && /^\s{2,}\S/.test(line)) {
      html += `<div class="list-sub">${line.trim()}</div>`;
      return;
    }

    if (inList && line.trim() === "") {
      return;
    }

    if (inList) {
      html += "</ul>\n"; // 👈 여기서 \n을 추가하여 다음 줄과 분리합니다.
      inList = false;
    }

    html += line + "\n";
  });

  if (inList) html += "</ul>";
  return html;
}

function render(md) {
  // 1. 블록 단위 요소 (먼저 처리해서 구조를 잡습니다)
  md = md.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="language-${lang || ''}">${escapeHtml(code)}</code></pre>`
  );
  
  md = parseTable(md);
  md = parseList(md); // 리스트 내부에서 제목 기호가 섞이지 않도록 주의

  // 2. 제목 (Header) 처리
  // ^ 기호가 줄 시작을 잘 인식하도록 \n을 기준으로 확실히 처리합니다.
  md = md
    .replace(/^###### (.*)$/gm, "<h6>$1</h6>")
    .replace(/^##### (.*)$/gm, "<h5>$1</h5>")
    .replace(/^#### (.*)$/gm, "<h4>$1</h4>")
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>");

  // 3. 기타 인라인 문법
  md = md
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])_([^_\n]+)_([\s).,!?]|$)/g, '$1<em>$2</em>$3')
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/~~(.*?)~~/g, "<del>$1</del>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">')
    .replace(/^---$/gm, "<hr>");

  // 4. 문단 처리 (가장 마지막에 수행)
  // 이미 HTML 태그(h1, ul, table 등)로 변환된 것들은 제외하고 순수 텍스트만 <p>로 감쌉니다.
  md = md
    .split(/\n{2,}/)
    .map(p => {
      p = p.trim();
      if (!p) return "";
      // 태그로 시작하는 블록은 그대로 두고, 일반 텍스트만 <p>로 감싸기
      return /^(<h|<table|<ul|<pre|<hr|<p|<div)/.test(p) ? p : `<p>${p}</p>`;
    })
    .join("");

  preview.innerHTML = md;
  Prism.highlightAllUnder(preview);
}


editor.addEventListener("input", () => render(editor.value));
render(editor.value);

/* ===== Theme ===== */
const bg = document.getElementById("bg");
const text = document.getElementById("text");
const accent = document.getElementById("accent");
const size = document.getElementById("size");

[bg,text,accent].forEach(i =>
  i.addEventListener("input",() =>
    document.documentElement.style.setProperty(`--${i.id}`, i.value)
  )
);
size.addEventListener("input",e =>
  document.documentElement.style.setProperty("--fontSize", e.target.value+"px")
);

function saveTheme() {
  localStorage.setItem("theme", JSON.stringify({
    bg:bg.value, text:text.value, accent:accent.value, size:size.value
  }));
}
function loadTheme() {
  const t = JSON.parse(localStorage.getItem("theme"));
  if(!t) return;
  bg.value=t.bg; text.value=t.text; accent.value=t.accent; size.value=t.size;
  bg.dispatchEvent(new Event("input"));
  text.dispatchEvent(new Event("input"));
  accent.dispatchEvent(new Event("input"));
  size.dispatchEvent(new Event("input"));
}

/* ===== New Window ===== */
function openNew() {
  const w = window.open("", "_blank");
  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css" rel="stylesheet">
      <style>${document.querySelector("style").innerHTML}</style>
    </head>
    <body style="background:var(--bg);color:var(--text)">
      <div class="preview">${preview.innerHTML}</div>
      <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"><\/script>
      <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-json.min.js"><\/script>
      <script>Prism.highlightAll();<\/script>
    </body>
    </html>
  `);
  w.document.close();
}
</script>

</body>
</html>
