<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>플랫폼 페이지</title>
  <script>
    function postToGameServer(
      url,
      { uid, nickname, access_token, refresh_token }
    ) {
      // 새 창 열기
      const gameWindow = window.open(url, "_blank");

      // 게임 창 로드 기다렸다가 데이터 전송
      setTimeout(() => {
        if (gameWindow && !gameWindow.closed) {
          gameWindow.postMessage(
            {
              type: "PLATFORM_LOGIN_DATA",
              uid,
              nickname,
              access_token,
              refresh_token,
            },
            "*" // 보안상은 게임 페이지의 origin으로 제한하는 게 안전
          );
        }
      }, 2000);
    }

    function handleClick() {
      postToGameServer("game.html", {
        uid: "user-123",
        nickname: "지닝",
        access_token: "access-xxx",
        refresh_token: "refresh-yyy",
      });
    }
  </script>
</head>
<body>
  <h1>플랫폼 페이지 3</h1>
  <button onclick="handleClick()">게임 시작</button>
</body>
</html>
